
name: Compilar Impossible Landscapes Final

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Buscar proyecto y compilar APK
        run: |
          SETTINGS="$(find . -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontro settings.gradle"
            find . -maxdepth 4 -type f
            exit 1
          fi

          cd "$(dirname "$SETTINGS")"
          echo "Compilando desde: $(pwd)"
          gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Impossible_Landscapes_Final_APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
